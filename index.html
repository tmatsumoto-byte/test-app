<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ブランドテスト</title>

<style>
  /* 全体背景 */
  body {
    font-family: 'Arial', sans-serif;
    padding: 20px;
    background: linear-gradient(to bottom, #f5f7fa, #c3cfe2);
    color: #333;
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }

  button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: 0.2s;
  }

  button:hover {
    background: #45a049;
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 3px rgba(0,0,0,0.2);
  }

  /* タイマーバー */
  #timerContainer {
    width: 100%;
    background: #eee;
    height: 20px;
    border-radius: 10px;
    margin: 10px 0 20px 0;
    overflow: hidden;
    position: relative;
  }

  #timerBar {
    width: 100%;
    height: 100%;
    background: lightgreen;
    border-radius: 10px;
    transition: width 0.2s linear, background 0.2s linear;
  }

  #timerText {
    position: absolute;
    width: 100%;
    text-align: center;
    line-height: 20px;
    font-weight: bold;
    color: #333;
  }

  /* 問題カード */
  #question {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    font-size: 18px;
    margin-bottom: 15px;
  }

  /* 選択肢ボタン */
  #choices button {
    background: #2196F3;
  }

  #choices button:hover {
    background: #1976D2;
  }

  #choices button:active {
    transform: translateY(2px);
  }

  /* 進行状況 */
  #progress {
    text-align: right;
    font-weight: bold;
    margin-bottom: 10px;
  }

  /* 結果表示 */
  #result {
    text-align: center;
    font-size: 20px;
    margin-top: 20px;
    color: #333;
  }
</style>

</head>
<body>

<h2>テスト開始</h2>

店舗名：<br>
<input type="text" id="shop"><br>

氏名：<br>
<input type="text" id="name"><br>

<hr>

<!-- タイマー表示 -->
<div id="timerContainer">
  <div id="timerBar"></div>
  <span id="timerText">30</span>
</div>

<div id="question">ここに問題が表示されます</div>
<div id="choices"></div>

<p id="progress"></p>

<button type="button" onclick="nextQuestion()">次へ</button>

<h3 id="result"></h3>

<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
